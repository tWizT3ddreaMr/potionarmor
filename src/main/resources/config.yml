meta:
  language_loc: language.yml
  version: 1.0
# async-multithreading options:
  async: true
  threads: 4
  maxThreads: 10
  capacity: 200 # thread queue job capacity, will reject new jobs after full
  timeout: 60 # how long to wait before killing idle threads
  unit: SECONDS # timeout time unit

Effects:
  item1:
    loreline: "my awesome lore"
    slot: any
    effect1:
      enable: false
      type: trail
      effect: star
      style: ""
      data:
        type: ordinary_color
        r: 100
        g: 100
        b: 100
        # must be 0-255
        # 999,999,999 is rainbow
        # 998,998,998 is random
    effect2:
      enable: false
      type: effect
      effect: minecraft:regeneration
      level: 1
    effect3:
      enable: false
      type: trail
      effect: star
      style: ""
      data:
        type: color_transition
        r: 100
        g: 100
        b: 100
        r2: 100
        g2: 100
        b2: 100
        # must be 0-255
        # 999,999,999 is rainbow
        # 998,998,998 is random
    effect4:
      enable: false
      type: trail
      effect: star
      style: ""
      data:
        type: note_color
        note: 5
        # must be 0 - 24
        # 99 is random
        # 98 is rainbow
    effect5:
      enable: false
      type: trail
      effect: star
      style: ""
      data:
        type: vibration
        duration: 100
        # arrival time in ticks
    effect6:
      enable: false
      type: trail
      effect: star
      style: ""
      data:
        type: material
        material: stone
  item2:
    loreline: "my second awesome lore"
    slot: hand
    effect1:
      enable: false
      type: effect
      effect: minecraft:regeneration
      level: 1