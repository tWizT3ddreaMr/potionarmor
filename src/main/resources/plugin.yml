name: ${project.artifactId}
author: tWizT3d_dreaMr,TonyJamesStark
version: ${project.version}
main: me.tWizT3d_dreaMr.PotionArmour.main
depend: [PlayerParticles]
commands:
  Pareset:
    description: Reset players effects.
    usage: pareset <player>
  reload:
    description: Reloads config
    usage: reload
  effects:
    description: Displays supported potion effects.
    usage: effects
permissions:
  Potionarmor.pareset:
    default: op
    description: Allows the player to Pareset.
  Potionarmor.reload:
    default: op
    description: Allows reloading of the plugin config
  Potionarmor.effects:
    default: op
    description: Allows printing of supported potion effects
api-version: 1.21